<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valorant Notes</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card-border: #2a2f3a;
    --accent: #ff4655;
    --accent-soft: #ff465522;
    --text: #e8e9ed;
    --text-dim: #a4a8b3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px 80px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 {
    font-size: 1.7rem;
    margin-bottom: 4px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.95rem;
    margin-bottom: 32px;
  }
  h2 {
    font-size: 0.85rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 32px 0 12px;
  }
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 16px 20px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  a.card:hover {
    border-color: var(--accent);
    transform: translateX(2px);
  }
  a.card .title {
    font-weight: 600;
    font-size: 1rem;
    display: block;
    margin-bottom: 3px;
  }
  a.card .desc {
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .empty-note {
    color: var(--text-dim);
    font-size: 0.85rem;
    font-style: italic;
    padding: 4px 2px;
  }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    margin-top: 48px;
  }
</style>
</head>
<body>
<div class="wrap">

  <h1>Valorant Notes</h1>
  <div class="subtitle">Personal reference docs — mindset, protocols, and reviews.</div>

  <h2>Notes</h2>
  <div class="card-list">
    <a class="card" href="notes/ranked-improvement-framework.html">
      <span class="title">Ranked Improvement Framework</span>
      <span class="desc">Mental model + pre-round protocol for treating ranked as a training ground, not a scoreboard.</span>
    </a>
    <!-- Add new notes here, same format:
    <a class="card" href="notes/your-file-name.html">
      <span class="title">Doc Title</span>
      <span class="desc">One-line description.</span>
    </a>
    -->
  </div>

</div>
</body>
</html>
